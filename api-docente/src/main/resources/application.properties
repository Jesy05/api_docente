spring.application.name=api-docente
spring.datasource.url=jdbc:postgresql://localhost:5432/db_docentes
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Credenciales locales (no se suben a git): crea application-local.properties
# con tu propia linea spring.datasource.password=...
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
